name: 🌐 Déployer les pages

# Active GitHub Pages (si nécessaire) et publie le dossier docs/ — les pages
# de connexion TikTok, Conditions d'utilisation et Confidentialité.
# Déploie via GitHub Actions : les fichiers sont servis tels quels (pas de
# Jekyll), donc _style.css fonctionne.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages (active Pages si besoin)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le dossier docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
